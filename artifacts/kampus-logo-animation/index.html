<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAMPÜS. Logo Animation</title>
    <style>
      :root {
        --ink: #f8f4f1;
        --orange: #ff7a45;
        --bg: #111014;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
      body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
        isolation: isolate;
        background:
          radial-gradient(circle at 50% 45%, rgba(255, 122, 69, .12), transparent 28%),
          radial-gradient(circle at 15% 90%, rgba(119, 67, 91, .14), transparent 34%),
          linear-gradient(145deg, #18151b 0%, #111014 48%, #0c0b0e 100%);
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 9;
        pointer-events: none;
        opacity: .06;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      }

      .orb {
        position: absolute;
        left: 50%; top: 47%;
        width: 64vmin; height: 64vmin;
        border: 1px solid rgba(255, 255, 255, .06);
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(.72);
        opacity: 0;
      }
      .orb::before, .orb::after {
        content: "";
        position: absolute;
        inset: 11%;
        border: 1px solid rgba(255, 122, 69, .08);
        border-radius: inherit;
      }
      .orb::after { inset: 24%; border-color: rgba(255, 255, 255, .045); }

      .brand {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(2.5vmin);
      }

      .logo {
        display: flex;
        align-items: flex-end;
        color: var(--ink);
        font-size: 13.2vmin;
        font-weight: 900;
        letter-spacing: -.075em;
        line-height: .82;
        filter: drop-shadow(0 1.4vmin 3vmin rgba(0,0,0,.28));
      }
      .letters { overflow: hidden; padding: .12em 0 .1em; }
      .letters > span { display: inline-block; }
      .left > span { transform: translateX(108%); }
      .right > span { transform: translateX(-108%); }

      .glyph {
        width: .98em;
        height: 1.22em;
        margin: 0 -.015em -.05em -.02em;
        overflow: visible;
      }
      .u-stroke {
        stroke-dasharray: 43;
        stroke-dashoffset: 43;
      }
      .lens { opacity: 0; transform-box: fill-box; transform-origin: center; }
      .lens-left { transform: translateY(-42px) rotate(-12deg) scale(.7); }
      .lens-right { transform: translateY(-42px) rotate(12deg) scale(.7); }
      .shine { opacity: 0; }
      .dot { color: var(--orange); display: inline-block; opacity: 0; transform: scale(0); transform-origin: 50% 85%; }

      .tagline {
        margin-top: 5.8vmin;
        color: rgba(248, 244, 241, .64);
        font-size: 2.35vmin;
        font-weight: 520;
        letter-spacing: .28em;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(1.4vmin);
      }

      .accent {
        position: absolute;
        z-index: 1;
        left: 50%; top: 47%;
        width: 1.4vmin; height: 1.4vmin;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 0 0 0 rgba(255,122,69,.25);
        opacity: 0;
        transform: translate(-50%, -50%);
      }

      .play .orb { animation: orb 4.2s cubic-bezier(.2,.8,.2,1) .1s both; }
      .play .u-stroke { animation: draw .66s cubic-bezier(.55,0,.2,1) .42s forwards; }
      .play .lens-left { animation: lensLeft .62s cubic-bezier(.2,.9,.25,1.28) .87s forwards; }
      .play .lens-right { animation: lensRight .62s cubic-bezier(.2,.9,.25,1.28) .99s forwards; }
      .play .shine { animation: shine .7s ease-out 1.32s forwards; }
      .play .left > span { animation: revealLeft .7s cubic-bezier(.2,.8,.2,1) 1.35s forwards; }
      .play .right > span { animation: revealRight .7s cubic-bezier(.2,.8,.2,1) 1.35s forwards; }
      .play .dot { animation: dotPop .55s cubic-bezier(.18,.9,.28,1.6) 1.94s forwards; }
      .play .tagline { animation: tagline .65s ease-out 2.25s forwards; }
      .play .accent { animation: pulse 1.1s ease-out 1.88s both; }

      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes lensLeft { 0% { opacity:0; transform:translateY(-42px) rotate(-12deg) scale(.7); } 100% { opacity:1; transform:translateY(0) rotate(0) scale(1); } }
      @keyframes lensRight { 0% { opacity:0; transform:translateY(-42px) rotate(12deg) scale(.7); } 100% { opacity:1; transform:translateY(0) rotate(0) scale(1); } }
      @keyframes shine { 0% { opacity:0; } 45% { opacity:.9; } 100% { opacity:.72; } }
      @keyframes revealLeft { to { transform:translateX(0); } }
      @keyframes revealRight { to { transform:translateX(0); } }
      @keyframes dotPop { 0% { opacity:0; transform:scale(0); } 68% { opacity:1; transform:scale(1.35); } 100% { opacity:1; transform:scale(1); } }
      @keyframes tagline { to { opacity:1; transform:translateY(0); } }
      @keyframes pulse { 0% { opacity:.8; box-shadow:0 0 0 0 rgba(255,122,69,.28); } 100% { opacity:0; box-shadow:0 0 0 52vmin rgba(255,122,69,0); } }
      @keyframes orb { 0% { opacity:0; transform:translate(-50%,-50%) scale(.72); } 24% { opacity:1; } 100% { opacity:.55; transform:translate(-50%,-50%) scale(1.08) rotate(12deg); } }
    </style>
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="orb"></div>
      <div class="accent"></div>
      <section class="brand" aria-label="KAMPÜS.">
        <div class="logo">
          <span class="letters left"><span>KAMP</span></span>
          <svg class="glyph" viewBox="0 0 30 36" aria-hidden="true">
            <defs>
              <linearGradient id="lens" x1="7" y1="1" x2="23" y2="11" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#77435b"/><stop offset=".48" stop-color="#34202c"/>
                <stop offset=".78" stop-color="#17151a"/><stop offset="1" stop-color="#675163"/>
              </linearGradient>
              <linearGradient id="rim" x1="6" y1="1" x2="24" y2="11" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffb18c"/><stop offset=".52" stop-color="#ff7a45"/><stop offset="1" stop-color="#aaa6ba"/>
              </linearGradient>
            </defs>
            <path class="u-stroke" d="M5.2 19.5c1.1 8.2 4.7 12.4 9.8 12.4s8.7-4.2 9.8-12.4" fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round"/>
            <g class="lens lens-left"><rect x="6.6" y="2" width="6.8" height="9.3" rx="3.4" transform="rotate(-5 10 6.65)" fill="url(#lens)" stroke="url(#rim)" stroke-width=".85"/></g>
            <g class="lens lens-right"><rect x="16.9" y="1.5" width="6.8" height="9.6" rx="3.4" transform="rotate(5 20.3 6.3)" fill="url(#lens)" stroke="url(#rim)" stroke-width=".85"/></g>
            <path class="shine" d="M8.8 4.25c-.45.7-.62 1.55-.55 2.45M19.1 3.8c-.42.72-.57 1.58-.48 2.48" fill="none" stroke="#fff8f1" stroke-width=".85" stroke-linecap="round"/>
          </svg>
          <span class="letters right"><span>S<span class="dot">.</span></span></span>
        </div>
        <div class="tagline">Kampüs hayatı, tek yerde</div>
      </section>
    </main>
    <script>
      window.startAnimation = () => document.getElementById('stage').classList.add('play');
    </script>
  </body>
</html>
