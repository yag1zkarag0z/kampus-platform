name: kampus-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kampus
      POSTGRES_USER: kampus
      POSTGRES_PASSWORD: kampus_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kampus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus -d kampus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kampus_test
      POSTGRES_USER: kampus_test
      POSTGRES_PASSWORD: kampus_test_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kampus_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kampus_test -d kampus_test"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - kampus_mailpit_data:/data

volumes:
  kampus_postgres_data:
  kampus_postgres_test_data:
  kampus_mailpit_data:
