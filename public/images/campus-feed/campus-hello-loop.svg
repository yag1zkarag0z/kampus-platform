<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <style>
    @keyframes float-left {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, -12px); }
    }
    @keyframes float-right {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-16px, 14px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: .35; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes signal {
      0%, 18% { opacity: 0; transform: translateY(8px); }
      32%, 82% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    .bubble-left { animation: float-left 3.4s ease-in-out infinite; transform-origin: center; }
    .bubble-right { animation: float-right 3.8s ease-in-out infinite; transform-origin: center; }
    .pulse { animation: pulse 1.7s ease-in-out infinite; transform-origin: center; }
    .signal-one { animation: signal 3.2s ease-in-out infinite; }
    .signal-two { animation: signal 3.2s .22s ease-in-out infinite; opacity: 0; }
    .signal-three { animation: signal 3.2s .44s ease-in-out infinite; opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .signal-one, .signal-two, .signal-three { opacity: 1; }
    }
  </style>
  <rect width="960" height="540" fill="#0b0b0e"/>
  <path d="M0 104h960M0 270h960M0 436h960M160 0v540M480 0v540M800 0v540" stroke="#fff" stroke-opacity=".035"/>
  <circle cx="480" cy="270" r="176" fill="#ff693d" fill-opacity=".035" stroke="#ff693d" stroke-opacity=".12"/>
  <g class="bubble-left">
    <path d="M164 148c0-30 24-54 54-54h286c30 0 54 24 54 54v96c0 30-24 54-54 54H312l-73 54 16-54h-37c-30 0-54-24-54-54v-96Z" fill="#17171d" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="266" cy="196" r="12" fill="#ff693d" class="signal-one"/>
    <circle cx="342" cy="196" r="12" fill="#ff693d" fill-opacity=".72" class="signal-two"/>
    <circle cx="418" cy="196" r="12" fill="#ff693d" fill-opacity=".44" class="signal-three"/>
  </g>
  <g class="bubble-right">
    <path d="M438 314c0-27 22-49 49-49h256c27 0 49 22 49 49v78c0 27-22 49-49 49h-26l13 43-59-43H487c-27 0-49-22-49-49v-78Z" fill="#ff693d"/>
    <path d="M535 352h160M535 388h104" stroke="#17120f" stroke-width="15" stroke-linecap="round" opacity=".76"/>
  </g>
  <g class="pulse">
    <circle cx="802" cy="128" r="12" fill="#ff693d"/>
    <circle cx="802" cy="128" r="25" fill="none" stroke="#ff693d" stroke-opacity=".24" stroke-width="3"/>
  </g>
</svg>
