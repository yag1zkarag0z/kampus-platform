<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" role="img" aria-labelledby="title description">
  <title id="title">KAMPÜS.</title>
  <desc id="description">Beyaz KAMPÜS yazısı, prizma biçimli Ü işareti ve turuncu nokta.</desc>
  <defs>
    <linearGradient id="lens" x1="7" y1="1" x2="23" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b2f"/>
      <stop offset=".48" stop-color="#171719"/>
      <stop offset=".78" stop-color="#101012"/>
      <stop offset="1" stop-color="#313136"/>
    </linearGradient>
    <linearGradient id="rim" x1="6" y1="1" x2="24" y2="11" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffad92"/>
      <stop offset=".52" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#ff805c"/>
    </linearGradient>
  </defs>

  <g fill="#ffffff" font-family="Inter, Arial, Helvetica, sans-serif" font-size="90" font-weight="900" letter-spacing="-5">
    <text x="18" y="101">KAMP</text>
    <text x="350" y="101">S</text>
  </g>

  <g transform="translate(270 16) scale(2.65)">
    <path
