      stroke-width="5.2"
      stroke-linecap="round"
    />
    <rect
      x="6.6"
      y="2"
      width="6.8"
      height="9.3"
      rx="3.4"
      transform="rotate(-5 10 6.65)"
      fill="url(#lens)"
      stroke="url(#rim)"
      stroke-width=".85"
    />
    <rect
      x="16.9"
      y="1.5"
      width="6.8"
      height="9.6"
      rx="3.4"
      transform="rotate(5 20.3 6.3)"
      fill="url(#lens)"
      stroke="url(#rim)"
      stroke-width=".85"
    />
    <path
      d="M8.8 4.25c-.45.7-.62 1.55-.55 2.45M19.1 3.8c-.42.72-.57 1.58-.48 2.48"
      fill="none"
      stroke="#fff8f1"
      stroke-width=".85"
      stroke-linecap="round"
      stroke-opacity=".72"
