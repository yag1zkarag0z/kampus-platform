name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://kampus_test:kampus_test_local@127.0.0.1:5433/kampus_test
      AUTH_SECRET: ci-auth-secret-that-is-not-used-outside-tests
      APP_ORIGIN: https://kampus.example.test
      SMTP_HOST: smtp.example.test
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "true"
      EMAIL_FROM: KAMPUS CI <no-reply@kampus.example.test>
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kampus_test
          POSTGRES_USER: kampus_test
          POSTGRES_PASSWORD: kampus_test_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kampus_test -d kampus_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kampus_test:kampus_test_local@127.0.0.1:5433/kampus_test
      DATABASE_URL: postgresql://kampus_test:kampus_test_local@127.0.0.1:5433/kampus_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database integration tests
        run: npm run test:db

  e2e:
    name: Cross-browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kampus_test
          POSTGRES_USER: kampus_test
          POSTGRES_PASSWORD: kampus_test_local
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kampus_test -d kampus_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.30.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://kampus_test:kampus_test_local@127.0.0.1:5433/kampus_test
      DATABASE_URL: postgresql://kampus_test:kampus_test_local@127.0.0.1:5433/kampus_test
      AUTH_SECRET: ci-auth-secret-that-is-not-used-outside-tests
      APP_ORIGIN: http://127.0.0.1:3100
      E2E_APP_ORIGIN: http://127.0.0.1:3100
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      EMAIL_FROM: KAMPUS CI <no-reply@kampus.local>
      MAILPIT_HTTP_URL: http://127.0.0.1:8025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required Gate
    if: always()
    needs:
      - quality
      - integration
      - e2e
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$E2E_RESULT" = "success"
